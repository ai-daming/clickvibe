name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure git identity for integration tests
        run: |
          git config --global user.email "ci@clickvibe.local"
          git config --global user.name "ClickVibe CI"
      - name: Seed ClickVibe config for project-list contract test
        run: |
          mkdir -p "$HOME/.clickvibe"
          printf 'repos:\n  ai-daming/clickvibe: %s\n' "$GITHUB_WORKSPACE" > "$HOME/.clickvibe/config.yaml"
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run coverage
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run check:size
      - run: pnpm run check:layers
      - run: pnpm run check:state-writes
      - run: pnpm run check:local-git-writes
      - run: pnpm run check:github-access
